<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishGuard - فحص الروابط المشبوهة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            font-family: Tahoma, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e0e1dd;
        }
        p {
            font-size: 14px;
            color: #a8dadc;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #415a77;
            border-radius: 8px;
            background-color: #0d1b2a;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background-color: #1d3557;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #457b9d;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background-color: #243447;
            border: 1px solid #415a77;
            font-size: 14px;
            text-align: right;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #778da9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>FishGuard 🛡️</h1>
        <p>أداتك الذكية لتحليل وفحص الروابط المشبوهة وكشف محاولات التصيد والاختراق لحظياً</p>

        <form method="POST">
            <label for="url" style="display: block; text-align: right; margin-bottom: 8px; font-size: 13px;">أدخل الرابط المراد فحصه:</label>
            <input type="text" id="url" name="url" placeholder="https://example.com" value="{{ url if url else '' }}" required>
            <button type="submit">فحص فوري</button>
        </form>

        {% if result %}
        <div class="result-box">
            <strong>نتيجة الفحص:</strong> <br>
            <span style="color: #fca311;">{{ result }}</span>
        </div>
        {% endif %}

        <div class="footer">
            🚀 Powered by SOMA
        </div>
    </div>

</body>
</html>
